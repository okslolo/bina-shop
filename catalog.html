<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalog — sab shop</title>
  <meta name="description" content="Sfoglia il catalogo di sab shop: abiti, top, giacche, borse, accessori e scarpe. Acquista in sicurezza su Vinted.">
  <meta name="theme-color" content="#f6dde1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23f6dde1'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia,serif' font-size='36' font-style='italic' fill='%23a55a67'%3Es%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="catalog">
  <a class="skip-link" href="#main">Vai al contenuto</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">Il nostro guardaroba</span>
        <h1>Catalog</h1>
        <p>Tutti gli articoli disponibili. Scegli quello che ti piace e completa l'acquisto in sicurezza su Vinted.</p>
      </div>
    </section>

    <section class="section" style="padding-top: 48px;">
      <div class="container">
        <div class="toolbar">
          <div class="chips" id="category-chips" role="group" aria-label="Filtra per categoria"></div>
          <div class="toolbar-controls">
            <label class="visually-hidden" for="search">Cerca nel catalogo</label>
            <input class="field" id="search" type="search" placeholder="Cerca un capo…" autocomplete="off">
            <label class="visually-hidden" for="sort">Ordina per</label>
            <select class="field" id="sort">
              <option value="new">Novità</option>
              <option value="likes">Più amati</option>
              <option value="price-asc">Prezzo: dal più basso</option>
              <option value="price-desc">Prezzo: dal più alto</option>
            </select>
          </div>
        </div>

        <p class="results-count" id="results-count" aria-live="polite"></p>
        <div class="product-grid" id="catalog-grid" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
